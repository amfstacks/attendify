<!doctype html>
<html>
<head>
    <title>Attendify App</title>
    <!-- Fabric.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <!-- Font Awesome for Icons (optional) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            color: #333;
            font-weight: 100;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            padding: 6px 10px;
            font-size: 16px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #textInput {
            width: 250px;
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-top: 15px;
            margin-bottom: 20px;
            text-align: center;
            background-color: #fff;
        }
        .input-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        label {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        #userImage {
            margin-bottom: 15px;
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 300px;
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 24px;
            }
            .input-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<h1>Church Of Christ Kado 23rd Annual Lectureship Attendify App</h1>

<center>
    <div class="input-container">
        <div>
            <label for="userImage">Choose Your Picture</label>
            <input type="file" id="userImage" accept="image/*">
        </div>
        <div>
            <label for="textInput">Enter Your Name</label>
            <input type="text" id="textInput" placeholder="Type your name here">
        </div>
    </div>
</center>
<div class="button-container">
    <button id="saveButton"> <i class="fas fa-save"></i> Download Design</button>
</div>

<!-- Canvas to display the template and uploaded image -->
<center>
    <canvas id="designCanvas" style="border: 1px solid #ccc;"></canvas>
</center>

<script>
    const canvas = new fabric.Canvas('designCanvas');

    // Variable to store regions
    let regions = [];

    // Load the base image
    fabric.Image.fromURL('/static/template.png', function(templateImg) {
        canvas.setWidth(templateImg.width);
        canvas.setHeight(templateImg.height);
        templateImg.selectable = false; // Make the template non-editable
        canvas.add(templateImg);
        canvas.sendToBack(templateImg);
        loadRegions(); // Load regions after base image is loaded
    });

    let userImageObj = null;
    let dynamicText;

    // Function to load predefined regions
    function loadRegions() {
        fetch('/regions.json')  // Fetch regions data
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(fetchedRegions => {
                regions = fetchedRegions;  // Assign fetched regions to the global variable
                console.log('Loaded Regions:', regions);
                if (regions.length === 1) {
                    const region = regions[0];
                    // No visualization to avoid stroke visibility
                } else {
                    alert('No regions defined by the admin.');
                }
            })
            .catch(err => {
                console.error('Error fetching regions:', err);
                alert('Failed to load regions. Please contact the administrator.');
            });
    }

    // Handle image upload and add it to the predefined region
    document.getElementById('userImage').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) {
            alert('No file selected.');
            return;
        }

        const validImageTypes = ['image/jpeg', 'image/png', 'image/gif'];
        if (!validImageTypes.includes(file.type)) {
            alert('Please upload a valid image file (JPEG, PNG, GIF).');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(event) {
            const userImg = new Image();
            userImg.src = event.target.result;
            userImg.onload = function() {
                // Crop the image to a square based on its smaller dimension
                const minDim = Math.min(userImg.width, userImg.height); // Find the smaller dimension
                const cropX = (userImg.width - minDim) / 2; // Crop equally from the left and right
                const cropY = (userImg.height - minDim) / 2; // Crop equally from the top and bottom

                const croppedCanvas = document.createElement('canvas');
                croppedCanvas.width = minDim;
                croppedCanvas.height = minDim;
                const ctx = croppedCanvas.getContext('2d');
                ctx.drawImage(userImg, cropX, cropY, minDim, minDim, 0, 0, minDim, minDim);
                const croppedDataURL = croppedCanvas.toDataURL('image/png');

                // Create Fabric.js Image from cropped DataURL
                fabric.Image.fromURL(croppedDataURL, function(croppedFabricImg) {
                    // Remove existing user image if any
                    if (userImageObj) {
                        canvas.remove(userImageObj);
                    }

                    // Check if regions are loaded
                    if (regions.length === 1) {
                        const region = regions[0];

                        // Calculate scaling factor to cover the entire circle
                        let scale = Math.max((region.radius * 2) / croppedFabricImg.width, (region.radius * 2) / croppedFabricImg.height);

                        // Optional: Adjust scale slightly to prevent excessive zoom
                        // For example, reduce scale by 10%
                        scale *= 1;

                        croppedFabricImg.set({
                            left: region.left,
                            top: region.top,
                            originX: 'center',
                            originY: 'center',
                            scaleX: scale,
                            scaleY: scale,
                            selectable: false,
                            hasControls: false,
                            hasBorders: false,
                            clipPath: new fabric.Circle({
                                radius: (region.radius / scale) *1,
                                originX: 'center',
                                originY: 'center'
                            })
                        });

                        // Add the image to the canvas
                        canvas.add(croppedFabricImg);
                        userImageObj = croppedFabricImg;
                        canvas.renderAll();
                    } else {
                        alert('No regions defined by the admin.');
                    }
                });
            }
        }
        reader.readAsDataURL(file);
    });

    // Handle name input
    document.getElementById('textInput').addEventListener('input', function() {
        const textInput = document.getElementById('textInput').value.toUpperCase();

        // If there's no dynamic text object yet, create it
        if (!dynamicText) {
            dynamicText = new fabric.Text(textInput, {
                left: canvas.width / 2,  // Center horizontally
                top: canvas.height - 100, // Position near the bottom
                fontFamily: 'Arial',
                fontSize: 24,
                fill: 'black',
                originX: 'center',
                originY: 'center',
                selectable: false,
                hasControls: false,
                hasBorders: false
            });

            canvas.add(dynamicText); // Add the text to the canvas
        } else {
            // Update the existing text object with the new value
            dynamicText.set({ text: textInput });
            canvas.renderAll(); // Re-render the canvas to reflect changes
        }
    });

    // Save the final design
    document.getElementById('saveButton').addEventListener('click', function() {
        if (!userImageObj) {
            alert('Please upload an image before downloading.');
            return;
        }

        const dataURL = canvas.toDataURL('image/png'); // Export canvas as an image
        fetch('/save', {
            method: 'POST',
            body: JSON.stringify({ image: dataURL }),
            headers: { 'Content-Type': 'application/json' }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.blob();
            })
            .then(blob => {
                // Create a downloadable link for the user
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'attendify_design.png';
                link.click();
            })
            .catch(err => {
                console.error('Error saving design:', err);
                alert('Failed to save the design. Please try again.');
            });
    });
</script>
</body>
</html>
